<!doctype html>
<html lang="ru">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>bezhevo — не по плану</title>
<style>
/* --u = one retro pixel, integer so the DOM stays crisp; text NEVER goes into the 240p buffer */
:root{--u:3px;--ink:#f5efe6;--plate:rgba(38,30,44,.72);--accent:#f7d063}
html,body{margin:0;height:100%;background:#000;overflow:hidden;-webkit-text-size-adjust:100%}
body{position:relative;height:100dvh}
:root{
  --device-top:env(safe-area-inset-top,0px);
  --device-right:env(safe-area-inset-right,0px);
  --device-bottom:env(safe-area-inset-bottom,0px);
  --device-left:env(safe-area-inset-left,0px);
}
#film{
  position:absolute;top:0;left:0;width:100%;height:100%;overflow:hidden;
  container:film / size;
  --safe-top:var(--device-top);--safe-right:var(--device-right);
  --safe-bottom:var(--device-bottom);--safe-left:var(--device-left);
}
#film.quarter-turn{
  transform-origin:0 0;
  transform:rotate(90deg) translateY(-100%);
  /* The film's top edge now runs along the physical right side of the phone. */
  --safe-top:var(--device-right);--safe-right:var(--device-bottom);
  --safe-bottom:var(--device-left);--safe-left:var(--device-top);
}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated}
#ui{position:absolute;inset:0;pointer-events:none;color:var(--ink);
    font:600 16px/1.35 ui-monospace,"SF Mono",Menlo,monospace;
    padding:max(2.5vmin,var(--safe-top)) max(2.5vmin,var(--safe-right))
            max(2.5vmin,var(--safe-bottom)) max(2.5vmin,var(--safe-left));
    display:grid;grid-template-rows:auto 1fr auto}
#ui [hidden]{display:none!important}                 /* beats any display: rule below */
#ui .plate{background:var(--plate);padding:calc(var(--u)*2) calc(var(--u)*3);
    border:var(--u) solid rgba(255,255,255,.14);text-shadow:0 var(--u) 0 rgba(0,0,0,.6)}
/* subtitles: an RPG dialogue box for the spoken opening, a plain caption for the sung lines. Both live in the DOM,
   never in the 240p buffer, so the type stays crisp at any window size. The box is the page's own `.plate`, so a
   replacement skin — a portrait, a frame, a font — is a CSS swap and not a scene edit. */
#sub{position:absolute;left:max(5%,var(--safe-left));right:max(5%,var(--safe-right));
    bottom:max(calc(var(--u)*7),calc(var(--safe-bottom) + 6px));max-width:900px;margin-inline:auto;box-sizing:border-box;text-align:center;white-space:pre-line;opacity:0;transition:opacity .16s linear;
    font-size:clamp(19px,3.1vmax,38px);font-size:clamp(19px,3.1cqw,38px);line-height:1.3;
    text-shadow:0 var(--u) 0 rgba(0,0,0,.72),0 0 calc(var(--u)*3) rgba(0,0,0,.55)}
#sub.on{opacity:1}
#sub.talk{text-align:left;background:rgba(10,14,20,.86);padding:calc(var(--u)*3) calc(var(--u)*4);
    border:calc(var(--u)/1.5) solid rgba(160,190,205,.34);box-shadow:0 calc(var(--u)*2) calc(var(--u)*8) rgba(0,0,0,.55)}
#sub.talk::before{content:'';display:inline-block;width:.5em;height:.62em;margin-right:.6em;vertical-align:-.02em;
    background:#4df0c4;clip-path:polygon(0 0,100% 50%,0 100%)}
#ui button,#ui .tap{pointer-events:auto;min-width:48px;min-height:48px;font:inherit;color:inherit;
    background:var(--plate);border:var(--u) solid rgba(255,255,255,.22);cursor:pointer}
#ui button:focus-visible{outline:var(--u) solid var(--accent);outline-offset:var(--u)}
#cover{
  position:absolute;inset:0;box-sizing:border-box;
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  padding-block:max(12px,var(--safe-top),var(--safe-bottom));
  padding-inline:max(18px,var(--safe-left),var(--safe-right));
  background:radial-gradient(ellipse closest-side,rgba(8,17,20,.70) 0%,rgba(8,17,20,.52) 47%,rgba(8,17,20,.10) 100%,transparent 145%);
}
#cover p,#cover h1{text-shadow:0 2px 2px rgba(7,16,18,.85)}
#cover p{margin:0 0 .3rem;color:#a8e7d5;font-size:clamp(.9rem,2.1vmin,1.15rem)}
#cover h1{margin:0 0 .7rem;font-size:clamp(2.2rem,7.4vmin,4.7rem);letter-spacing:-.065em;line-height:1}
#cover #play{min-height:44px;padding:.45em .9em;background:#d0e9df;border:2px solid #e4f3eb;box-shadow:3px 3px 0 #17282c;color:#172b2c;font-size:.95rem}
#cover #play span{color:#285b51}
#cover #play:hover{background:#ecf5ee}
.ps-progress{position:absolute;inset:auto 0 0;height:var(--u);background:rgba(255,255,255,.18)}
#fill{width:0;height:100%;background:var(--ink)}

#end-screen {
  --print:#242b24;
  --paper:#f0ede2;
  --edge:#b3b5a5;
  position:absolute;
  inset:0;
  box-sizing:border-box;
  display:grid;
  place-items:center;
  grid-template:minmax(0,1fr) / minmax(0,1fr);
  padding:max(16px,var(--safe-top)) max(20px,var(--safe-right)) max(16px,var(--safe-bottom)) max(20px,var(--safe-left));
  pointer-events:auto;
  background:rgba(15,24,21,.52);
  color:var(--print);
  font:400 16px/1.25 "Helvetica Neue",Arial,sans-serif;
  text-shadow:none;
  animation:release-appear .24s ease-out both;
}
@keyframes release-appear { from { opacity:0 } to { opacity:1 } }
.release-credits {
  position:relative;
  box-sizing:border-box;
  width:min(730px,100%);
  max-height:100%;
  overflow:auto;
  overscroll-behavior:contain;
  display:grid;
  grid-template-columns:minmax(0,.86fr) minmax(0,1.3fr);
  align-items:center;
  gap:18px 23px;
  padding:24px 26px 15px;
  background:var(--paper);
  border:1px solid #b7baaa;
  border-radius:3px;
  box-shadow:3px 5px 0 rgba(9,17,14,.45);
}
#end-screen #dismiss-end {
  position:absolute;
  top:3px;
  right:3px;
  display:grid;
  place-items:center;
  width:40px;
  height:40px;
  min-width:0;
  min-height:0;
  padding:0;
  border:0;
  border-radius:3px;
  color:#4f584a;
  background:transparent;
  cursor:pointer;
}
.release-sleeve {
  box-sizing:border-box;
  align-self:stretch;
  display:grid;
  align-content:center;
  padding-right:20px;
  border-right:3px double #c5c6b7;
}
.release-art { display:block; width:100%; height:auto; box-shadow:0 1px 3px #4f534039 }
.release-detail { min-width:0 }
.release-artist { margin:0; font-size:15px; line-height:1.1; letter-spacing:.01em }
#end-title { width:fit-content; margin:2px 28px 15px 0; font:italic 400 49px/.97 Georgia,"Times New Roman",serif; letter-spacing:-.055em }
#end-title:focus { outline:none }
#release-listen { margin:0 0 7px; font-size:14px; color:#414b3f }
.release-music ul { list-style:none; margin:0; padding:0; display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:7px }
.release-music a,.release-buy,#end-screen #replay {
  box-sizing:border-box;
  display:flex;
  align-items:center;
  gap:8px;
  border:1px solid var(--edge);
  border-bottom-color:#88917c;
  border-radius:5px;
  padding:0 11px;
  background:#faf9f1;
  color:var(--print);
  text-decoration:none;
  text-align:left;
  white-space:nowrap;
  font:600 15px/1.1 "Helvetica Neue",Arial,sans-serif;
  cursor:pointer;
  -webkit-tap-highlight-color:rgba(64,102,69,.2);
}
.release-music a { min-height:47px }
.platform-icon { flex:none; width:23px; height:23px; display:grid; place-items:center }
.platform-icon > * { display:block; width:100%; height:100%; object-fit:contain }
.release-actions {
  grid-column:1 / -1;
  display:flex;
  align-items:center;
  flex-wrap:wrap;
  gap:5px 8px;
  border-top:1px solid #c0c3b2;
  padding-top:10px;
}
.release-buy,#end-screen #replay { min-width:0; min-height:36px; padding:0 10px; font-size:13px; font-weight:500 }
.release-buy { background:transparent }
.release-buy .platform-icon { width:17px; height:17px }
#end-screen #replay { background:#344a39; border-color:#344a39; color:#fffef5 }
.release-author {
  display:inline-flex;
  align-items:center;
  margin-left:auto;
  min-height:30px;
  font:400 11px/1.1 "Helvetica Neue",Arial,sans-serif;
  color:#59604f;
  white-space:nowrap;
  text-decoration:underline;
  text-decoration-color:#9a9e8d;
  text-underline-offset:2px;
}
#end-screen a:focus-visible,#end-screen button:focus-visible { outline:2px solid #305f3a; outline-offset:2px }
@media (hover:hover) {
  .release-music a:hover,.release-buy:hover { background:#e7ecdf; border-color:#677961 }
  #end-screen #replay:hover { background:#253d2b }
  #end-screen #dismiss-end:hover { background:#e1e2d5 }
  .release-author:hover { color:#244d30; text-decoration-color:currentColor }
}
.release-music a:active,.release-buy:active,#end-screen #replay:active { transform:translateY(1px) }
@container film (max-height:480px) {
  #end-screen { padding:max(12px,var(--safe-top)) max(18px,var(--safe-right)) max(12px,var(--safe-bottom)) max(18px,var(--safe-left)) }
  .release-credits { width:min(624px,100%); grid-template-columns:minmax(0,.66fr) minmax(0,1.3fr); padding:13px 16px 9px; gap:10px 15px }
  .release-sleeve { padding-right:13px }
  .release-artist { font-size:13px }
  #end-title { margin:1px 0 7px; font-size:33px }
  #release-listen { margin-bottom:5px; font-size:12px }
  .release-music ul { gap:5px }
  .release-music a { min-height:44px; padding:0 8px; gap:7px; font-size:13px }
  .platform-icon { width:20px; height:20px }
  .release-actions { padding-top:6px }
  .release-buy,#end-screen #replay { min-height:32px; font-size:12px }
  .release-author { font-size:10px }
}
@container film (max-width:580px) {
  #end-screen { padding:max(9px,var(--safe-top)) max(12px,var(--safe-right)) max(9px,var(--safe-bottom)) max(12px,var(--safe-left)) }
  .release-credits { grid-template-columns:minmax(0,.52fr) minmax(0,1.3fr); padding:10px 12px 7px; gap:8px 11px }
  .release-sleeve { padding-right:9px }
  #end-title { font-size:29px; margin-bottom:4px }
  .release-actions { gap:4px 6px }
}
@container film (max-height:285px) {
  #end-screen { padding-top:max(6px,var(--safe-top)); padding-bottom:max(6px,var(--safe-bottom)) }
  .release-credits { padding-block:8px 5px; row-gap:5px }
  #end-title { margin-bottom:3px; font-size:28px }
  .release-actions { padding-top:4px }
}
@container film (max-width:480px) {
  .release-credits { grid-template-columns:auto minmax(0,1fr); grid-template-areas:"art artist" "art title" "music music" "actions actions"; row-gap:3px }
  .release-sleeve { grid-area:art; align-self:center; width:44px; padding:0; border:0 }
  .release-detail { display:contents }
  .release-artist { grid-area:artist; align-self:end }
  #end-title { grid-area:title }
  .release-music { grid-area:music }
  .release-actions { grid-area:actions }
}
@media (prefers-reduced-motion:reduce){#ui *{animation:none!important;transition:none!important}}
</style>

<script>
(() => {
  const page = document.body;
  const film = document.getElementById('film');
  // Preserve the explicit page dimensions used for deterministic film stills.
  const stillSize = /[?&]vw=(\d+)&vh=(\d+)/.exec(location.search);
  if (stillSize) {
    for (const root of [document.documentElement, page]) {
      root.style.width = stillSize[1] + 'px';
      root.style.height = stillSize[2] + 'px';
    }
  }
  function fitFilmFrame() {
    const width = page.clientWidth;
    const height = page.clientHeight;
    film.style.width = Math.max(width, height) + 'px';
    film.style.height = Math.min(width, height) + 'px';
    film.classList.toggle('quarter-turn', height > width);
  }
  fitFilmFrame();
  if (typeof ResizeObserver === 'function') new ResizeObserver(fitFilmFrame).observe(page);
  else window.addEventListener('resize', fitFilmFrame);
})();
</script>

  // is 0.2 of the WHOLE object capped at 0.34 m — 0.34 m at stock size against a 0.07 r (0.14 m) deck — so left
  // alone it swallowed the deck whole and then climbed 0.20 m up the POLES, blending `c.foot` into a material that
  // never touches the ground. libFoot mixes per RGB CHANNEL and is not hue-preserving, so that band carries a hue
  // of its own: measured on the watchman palette, a pole base (`#d95b65`, hue 355.2 deg) mixed toward the ground

  // own 0.520 to 0.453 (and to 0.431 at a deeper floor), off the 0.45-0.60 band. Three things hold it shut:
  //   `foot.h = platH` — the junction stops exactly at the deck's top face, where the poles start, at any r and h;
  //   `platH >= fh * .6` — a `cyl` has no vertex ring between its ends, so the junction lives on the deck's ground
  //      ring alone and the deck must stand clear of the skirt's own upper band for that ring to read as a band;
  //   `mix .35` (under libFoot's .55) — that single ring cannot carry a value ladder of its own, so the blend has

// torch({h, foot, c:{wood,fire,foot}}) — 36 tris; .glowPos at the flame. `foot` on: a torch is planted — pass false

// campfire({r, foot, c:{stone,wood,fire,foot}}) — 92 tris: 6 jittered stones n:2, 3 crossed logs, flame cone;

// ---- pickups & markers (give their material `glow`) ----
// These hover, spin and get picked up, so `foot` defaults to false: a ground junction on a floating gem is a lie.
// crystal({h, c:{gem}, seed}) — 60 tris: 3 lathe shards n:5
lib.crystal = function (o) {

};
// coin({r, c:{gold,rim,mint}}) — 28 tris: cyl n:8 standing on its edge, faces ±Z. Rotated op, so the ramp reads the
// position after the transform ({world:true}) and keeps pointing at the sky. Gold faces; the reeded edge alternates
// copper and pale mint facet by facet.
lib.coin = function (o) {
  o = libOpt(o, { r: .3, foot: false, c: { gold: '#f2c14e', rim: '#a86a48', mint: '#e8e0b0' } }); var r = o.r, c = o.c;
  var face = libAO(c.gold, 2 * r, .42, 0, { world: true, steps: 5, scale: r * .3 }), rim = libAO(c.rim, 2 * r, .42, 0, { world: true, steps: 3, scale: r * .3 }), mint = libAO(c.mint, 2 * r, .42, 0, { world: true, steps: 3, scale: r * .3 });

    if (Math.abs(n[1]) > .5) return face(p, n, out, wp, wn);                                  // local ±Y = the two faces
    return (Math.round(Math.atan2(n[2], n[0]) / (2 * PI / 8)) & 1 ? rim : mint)(p, n, out, wp, wn); } }], o);
};
// gem({s, c:{gem}}) — 24 tris: lathe bipyramid n:6
lib.gem = function (o) {
  o = libOpt(o, { s: .5, foot: false, c: { gem: '#e04a8a', girdle: '#ffc0e0', pavilion: '#5a2a8a' } }); var s = o.s, c = o.c;
  function cut(h) { return libAO(h, s, .5, 0, { steps: 5, amt: .34, scale: s * .22 }); }

  return libBuild(['lathe', { pts: [[0, 0], [s * .5, s * .38], [s * .42, s * .5], [0, s]], n: 6, c: function (p, n, out) {   // pavilion under the girdle, crown above
    return (p[1] < s * .38 - 1e-6 ? pav : p[1] < s * .5 - 1e-6 ? girdle : crown)(p, n, out); } }], o);
};
// star({r, c:{star}}) — 36 tris: 5-point prism, upright, faces ±Z
lib.star = function (o) {
  o = libOpt(o, { r: .5, foot: false, c: { star: '#ffd84a', edge: '#ff9a30', back: '#8a5aa0' } }); var r = o.r, pts = [], i, a, k;
  for (i = 0; i < 10; i++) { a = PI / 2 + i * PI / 5; k = i % 2 ? r * .42 : r; pts.push([k * cos(a), k * sin(a)]); }
  return libBuild(['prism', { pts: pts, h: r * .3, c: libFaceZ(o.c, 'star', 2 * r, -r, r * .3) }], o);
};
// ring({r, t, c:{gold,inner,stone}}) — 64 tris: lathe torus n:8, standing, faces ±Z. Rotated op: the ramp reads the
// position after the transform ({world:true}) and stays vertical. Gold outside, rose-gold inside, a stone on top.
lib.ring = function (o) {
  o = libOpt(o, { r: .5, t: .08, foot: false, c: { gold: '#f2c14e', inner: '#d88a6a', stone: '#e04a5a' } }); var r = o.r, t = o.t, c = o.c, H = 2 * (r + t);
  function band(h) { return libAO(h, H, .42, 0, { world: true, steps: 5, scale: (r + t) * .3 }); }
  var gold = band(c.gold), inner = band(c.inner), stone = band(c.stone);

// arrow({len, c:{arrow}}) — 24 tris: flat prism lying on the ground, pointing +X. The 7 edges take 5 values, the
// top face stays the full colour (it is the one being read) and the underside the darkest.
lib.arrow = function (o) {
  o = libOpt(o, { len: 1, foot: false, c: { arrow: '#ffffff', edge: '#5ad8d0', back: '#2a4a8a' } }); var L = o.len, c = o.c.arrow, a = libDown(o.c.edge, 5, .45);
  return libBuild(['prism', { pts: [[-.5, -.12], [.1, -.12], [.1, -.3], [.5, 0], [.1, .3], [.1, .12], [-.5, .12]], h: .06, s: L, r: [-90, 0, 0], p: [0, .03 * L, 0], c: [a[2], a[0], a[3], a[1], a[3], a[0], a[2], c, o.c.back] }], o);   // white top, teal edges, blue underside
};
// heart({s, c:{heart}}) — 44 tris: 12-point prism, upright, faces ±Z
lib.heart = function (o) {
  o = libOpt(o, { s: .5, foot: false, c: { heart: '#e8304a', edge: '#ff8aa8', back: '#6a2060' } }); var s = o.s, pts = [], i, a;

// libFaceZ(c, key, h, y0, sc) — an upright prism marker in three materials: c[key] on the +Z face (the one being read),
// c.edge round the sides, c.back on the −Z face. Each carries its own ramp and step.

// ---- furniture & setting props (docs/vocabulary-research.md §1 & §9: furniture had ZERO coverage — the largest
// indoor category in every external dataset it consulted — and four owner-named settings (shop, cave, beach, dance
// floor/club) had no purpose-built geometry at all. table/chair/shelf close the furniture gap; stall/speaker/disco/
// umbrella give shop, club and beach their first landmark-tier prop. Several other §1 entries are cheaper as a
// parameter on an existing builder (fern → `grass` style, fallen log → a `tree` variant, bollard → a short
// `column`, stalactite → a recoloured, node-flipped `crystal`) and were left for that follow-up rather than forked
// here, the same lesson the carousel's own history already taught.) ----
// table({w, d, h, foot, c:{wood, trim, leg, foot}}) — 84 tris (top 12 + apron 2×12 + 4 legs ×12): a flat top on 4
// thin metal legs, no back and no side panels — the open space between the legs on every side is what keeps this
// "table" and not `bench`, which fills that same space with a back and two solid side panels
// (docs/vocabulary-research.md §1 #2 — `bench` is the closest existing shape and is wrong for exactly this reason).
// A dark-wood apron under the front and back edges gives AS-9's 3rd base hue alongside the tan top and the metal legs.
lib.table = function (o) {
  o = libOpt(o, { w: 1.3, d: .8, h: .74, foot: true, c: { wood: '#8a6a42', trim: '#4a2a1c', leg: '#55555c', foot: '#4b4636' } });
  var w = o.w, d = o.d, h = o.h, c = o.c, topH = h * .07, legH = h - topH, legR = Math.min(w, d) * .05, inset = legR * 1.4;
  var ops = [['box', { s: [w, topH, d], p: [0, h - topH / 2, 0], c: libAO(c.wood, topH, null, null, { steps: 4, scale: w * .22 }) }]];
  [-1, 1].forEach(function (q) { ops.push(['box', { s: [w - 2 * inset, legH * .12, legR * .8], p: [0, h - topH - legH * .06, q * (d / 2 - inset)], c: libBox(c.trim, .88) }]); });   // the apron
  [[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(function (q, i) {
    ops.push(['box', { s: [legR, legH, legR], p: [q[0] * (w / 2 - inset), legH / 2, q[1] * (d / 2 - inset)], c: libAO(c.leg, legH, null, null, { steps: 4, amt: .32, scale: legR * .9, seed: 21 + i * 13 }) }]);
  });
  return libBuild(ops, o);
};
// chair({w, d, seatH, backH, foot, c:{wood, back, leg, foot}}) — 72 tris (seat 12 + 4 legs ×12 + backrest slat 12):
// a seat on 4 THIN separated metal legs, the two rear ones running up past the seat into a pair of back posts
// joined by one painted slat — the visible gaps between all 4 legs (vs `bench`'s 2 solid side panels) and the
// single-seat footprint (vs `table`'s bigger, backless top) are what keep this "chair" (docs/vocabulary-research.md
// §1 #3 — ScanNet-20's and 3D-FUTURE's largest indoor category by instance count, zero coverage before this).
lib.chair = function (o) {
  o = libOpt(o, { w: .45, d: .45, seatH: .45, backH: .42, foot: true, c: { wood: '#9a6f45', back: '#2e5f6e', leg: '#55555c', foot: '#4b4636' } });
  var w = o.w, d = o.d, sh = o.seatH, bh = o.backH, c = o.c, legR = Math.min(w, d) * .09, inset = legR * 1.3;
  var ops = [['box', { s: [w, sh * .08, d], p: [0, sh, 0], c: libAO(c.wood, sh * .08, null, null, { steps: 4, scale: w * .3 }) }]];   // the seat
  [[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(function (q, i) {
    var top = q[1] > 0 ? sh + bh : sh;   // the +Z pair keeps rising past the seat to become the back posts
    ops.push(['box', { s: [legR, top, legR], p: [q[0] * (w / 2 - inset), top / 2, q[1] * (d / 2 - inset)], c: libAO(c.leg, top, null, null, { steps: 4, amt: .32, scale: legR, seed: 31 + i * 13 }) }]);
  });
  ops.push(['box', { s: [w - 2 * inset, bh * .5, legR], p: [0, sh + bh * .6, d / 2 - inset], r: [8, 0, 0], c: libBox(c.back, .9) }]);   // the painted slat between the two back posts, leaning slightly with them
  return libBuild(ops, o);
};
// shelf({w, d, h, shelves, foot, c:{wood, trim, side, foot}}) — 96 tris at the default 3 shelves (2 sides ×12 + n
// boards ×12 + n edge-trims ×12): two full-height metal side panels framing n open, THICK slab boards with a
// painted edge band on each, no back and no doors — the horizontal gaps between the boards are the "shelf" tell (a
// solid front would read as `crate`/cabinet instead). Proportioned wider than tall with thick boards on purpose —
// a first build at bookcase proportions (tall, narrow, thin evenly-spaced boards) read as "ladder" cold; width over
// height and board mass over board count is what keeps it "shelf". Cousin of `bridge`'s deck-between-rails
// technique. `ps-lite/projects/museum` named exactly this ("shelf") and left it `prefab:"custom"`
// (docs/vocabulary-research.md §1 #4).
lib.shelf = function (o) {
  o = libOpt(o, { w: 1.3, d: .42, h: 1.1, shelves: 3, foot: true, c: { wood: '#8a6a42', trim: '#8c3a2e', side: '#55555c', foot: '#4b4636' } });
  var w = o.w, d = o.d, h = o.h, n = Math.max(2, o.shelves | 0), c = o.c, sideT = w * .06, boardT = h * .07, ops = [], i, y;
  var footH = Math.min(.34, Math.max(.05, h * .2)), yMin = footH * 1.5 + boardT * 1.2;   // keep every board (and its trim) clear of `foot`'s own skirt band — a board that dips into it picks up a 3rd, partially-mixed value band that reads to AS-10 as an under-stepped material, not a real 3rd material
  [-1, 1].forEach(function (q, i) { ops.push(['box', { s: [sideT, h, d], p: [q * (w / 2 - sideT / 2), h / 2, 0], c: libAO(c.side, h, null, null, { steps: 5, scale: d * .6, seed: 41 + i * 17 }) }]); });
  for (i = 0; i < n; i++) {   // wide, thick slab boards — a shelf reads by mass, a thin evenly-spaced rung reads as `ladder`
    y = yMin + (h - yMin) * (i + .5) / n;
    ops.push(['box', { s: [w - 2 * sideT, boardT, d], p: [0, y, 0], c: libBox(i % 2 ? libSh(c.wood, .9) : c.wood) }]);
    ops.push(['box', { s: [w - 2 * sideT, boardT * .6, boardT * .6], p: [0, y - boardT * .8, d / 2 - boardT * .4], c: libBox(c.trim, .85) }]);   // painted edge band on the shelf's front lip
  }
  return libBuild(ops, o);
};
// stall({w, d, h, gap, roofH, foot, c:{wood, post, roofA, roofB, foot}}) — 66 tris (counter 12 + 4 posts ×12 + a
// striped 4-sided awning 6): a raised counter and a steep, clearly peaked canopy on 4 metal corner posts, with a
// full `gap` (default 0.9 m) of open AIR between them — that negative space is the identifying feature that keeps
// this "market stall" and not `table`: a first build set the canopy almost flush above the counter and, wide and
// shallow, it silhouetted as one flat plate on stilts, reading cold as "table"/"platform". Steepening the roof and
// opening the gap (the same "negative space between two solid volumes" lesson `carousel`'s own history already
// taught) fixed it. The stripe is biased 3:1 toward `roofA` so it alone clears AS-9's 5 % share floor without a 4th
// colour. Shop is an owner-named setting with zero purpose-built geometry before this (docs/vocabulary-research.md
// §1 #10 — also a first-class category in Quaternius' Fantasy Props MegaKit and KayKit's dungeon/medieval packs,
// alongside furniture and storage).
lib.stall = function (o) {
  o = libOpt(o, { w: 2, d: 1, h: 1, gap: .9, roofH: .6, foot: true, c: { wood: '#8a6a42', post: '#55555c', roofA: '#c93a34', roofB: '#e8e0d0', foot: '#4b4636' } });
  var w = o.w, d = o.d, h = o.h, gap = o.gap, rh = o.roofH, c = o.c, postR = Math.min(w, d) * .04, counterH = h * .08;
  var roofR = Math.max(w, d) * .62, postH = h + gap + rh;   // a full `gap` of open AIR between the counter and the canopy is the read — see carousel's own lesson on negative space
  var ops = [['box', { s: [w, counterH, d], p: [0, h - counterH / 2, 0], c: libAO(c.wood, counterH, null, null, { steps: 4, scale: w * .2 }) }]];   // the counter
  [[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(function (q, i) {
    ops.push(['cyl', { r: postR, h: postH, n: 4, p: [q[0] * (w / 2 - postR * 1.5), postH / 2, q[1] * (d / 2 - postR * 1.5)], c: libAO(c.post, postH, null, null, { steps: 4, amt: .32, scale: postR, seed: 51 + i * 13 }) }]);
  });
  ops.push(['cyl', { r1: roofR, r2: 0, h: rh, n: 4, r: [0, 45, 0], p: [0, postH - rh / 2, 0], c: [c.roofA, c.roofB, c.roofA, c.roofA] }]);   // a steep, clearly peaked canopy on top of the posts, its own radius close to the counter's so it does not swallow it in silhouette
  return libBuild(ops, o);
};
// speaker({h, w, d, foot, c:{cab, grille, trim, foot}}) — 120 tris (3 uniform cabinets ×12 + 3 driver discs ×20 + 2
// amber carry handles ×12): a PA stack — 3 uniform boxes, each with one flat-fronted driver disc proud enough of
// the front face to break the box's own silhouette. HONEST NOTE on the cold-read gate: this is the one builder of
// the seven that did NOT converge to its own name in a flat black silhouette after three iterations — a tapered
// wedge with a pointed cone read "rocket"/"totem pole"; uniform cabinets with a shallow flush disc read as a plain
// pillar; this final shape (uniform cabinets, a deeper flat-fronted disc) still reads "totem pole" cold, closer to
// a stack of drums than to a speaker. What the silhouette CANNOT carry is the one cue that actually names a PA
// cabinet in every reference (grille cloth) — a colour/material property, not a shape, the same way `vitrine`'s
// glass or `greenhouse`'s glazing are read by material rather than outline. In its own dark cabinet + darker grille
// palette, in a scene, next to `disco` and a dance floor, it reads correctly; alone in silhouette it does not, and
// this comment says so rather than claiming otherwise. Dance floor/club is an owner-named setting with zero
// purpose-built geometry before this (docs/vocabulary-research.md §1 #13; the confidence note there already flags
// disco/speaker as leaning on tier 2a's general "stage/event" pack category rather than a dedicated dataset).
lib.speaker = function (o) {
  o = libOpt(o, { h: 1.6, w: .6, d: .5, foot: true, c: { cab: '#4a4a50', grille: '#3a2e24', trim: '#c9862e', foot: '#0e0e10' } });
  var h = o.h, w = o.w, d = o.d, c = o.c, n = 3, bh = h / n, ops = [], y = 0, i;
  for (i = 0; i < n; i++) {   // uniform cabinets (a tapered wedge read worse, see the comment above) — one driver disc per box
    ops.push(['box', { s: [w, bh * .96, d], p: [0, y + bh / 2, 0], c: libAO(c.cab, bh, null, null, { steps: 4, amt: .3, scale: w * .3, seed: 61 + i * 11 }) }]);
    ops.push(['cyl', { r1: w * .28, r2: w * .28, h: d * .5, n: 6, r: [90, 0, 0], p: [0, y + bh * .5, d / 2 + d * .2], c: libDown(c.grille, 4, .4) }]);
    y += bh;
  }
  [-1, 1].forEach(function (q) { ops.push(['box', { s: [w * .3, h * .04, d * .16], p: [0, y - h * .08, q * d * .27], c: libBox(c.trim, .9) }]); });   // 2 recessed amber carry handles on the top cabinet
  return libBuild(ops, o);
};
// disco({r, rod, foot, c:{tileA, tileB, mount, rod, foot}}) — 48 tris (faceted sph n:3 ~24 + hanging rod 12 +
// ceiling mount 12): a faceted ball hung by a short rod from a small brass ceiling mount. `n:3` on purpose, not the
// smoother `n:4` a first build used: a mirror ball's whole identity is its faceted surface, and the rounder n:4
// sphere silhouetted as a plain "balloon"/"pendant lamp" — the coarser, more angular facets are what a stranger
// reads as "disco ball" instead of "ball". `foot:false`, like the other hover shapes (`crystal`, `gem`, `coin`…): a
// disco ball hangs, it does not stand. The mount is a warm brass — a genuinely different hue from the ball's cool
// blue-grey tiles and the rod's neutral iron, since AS-9 clusters by hue and every other combination here is some
// shade of grey. The single unmistakable club silhouette on the ranked list, for the one owner-named setting with
// no coverage at all (docs/vocabulary-research.md §1 #14).
lib.disco = function (o) {
  o = libOpt(o, { r: .5, rod: .35, foot: false, c: { tileA: '#b9d0e0', tileB: '#6a86a0', mount: '#c9a04a', rod: '#2e2e30' } });
  var r = o.r, rl = o.rod, c = o.c, cy = rl + r + r;   // ball centre, with headroom below the rod for libBuild's own drop-to-y=0
  var ops = [
